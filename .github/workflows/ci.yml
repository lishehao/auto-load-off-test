name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src/app tests scripts

  windows-package:
    name: Windows one-folder package smoke
    runs-on: windows-latest
    needs: [test, lint]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build and run no-hardware package smoke
        shell: powershell
        run: >-
          .\scripts\build_windows_onefolder.ps1
          -RuntimeRoot "$env:RUNNER_TEMP\AutoLoadOffTestRuntime"
      - name: Upload smoke receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-smoke-receipt
          path: ${{ runner.temp }}/AutoLoadOffTestRuntime/__data__/package_smoke_receipt.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload one-folder package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AutoLoadOffTest-windows-onefolder
          path: dist/AutoLoadOffTest
          if-no-files-found: error
          retention-days: 14
